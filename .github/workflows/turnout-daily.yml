# Snapshots the press-room turnout files once a day during a campaign, and, while GG26 is being
# counted, the State Board's unofficial results pages.
#
# What it does: fetch any changed turnout file (sha-deduped, so an unchanged day
# downloads nothing new), parse the new snapshots into data/turnout/, rebuild the
# database, run the tests, and commit what changed. The token push cannot start the
# Pages workflow (GitHub ignores pushes made by a workflow's own token), so after
# committing the snapshot dispatches the publish itself; a person's push deploys the
# ordinary way.
#
# A parse that does not reconcile fails the run (red) rather than publishing a wrong
# number; the site keeps showing the previous day until someone looks at the file.
# Every run is cheap once the files stop changing (the sha-dedupe skips re-archiving).
# Keep it running while anything is still in flight: GG26's certified families appear
# after its canvass, and GP26's denominator files (official-turnout, eligible) went back
# to placeholder pages when the SBE re-published its tree on 2026-10-10 -- they ingest
# automatically when the board re-publishes. Disable only when nothing is pending.
#
# The unofficial results step snapshots the board's running GG26 count (an unchanged refresh
# is skipped) and does nothing once GG26's certified results are published. It may fail on its
# own -- a board refresh landing mid-fetch twice, or a page that no longer adds up -- without
# holding back the turnout snapshot: the run commits and publishes what did work, then goes red.
name: Turnout snapshot

on:
  schedule:
    - cron: "37 17 * * *" # 1:37 pm Eastern, after the SBE's morning file refresh
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  # actions: write lets the publish step below start the pages workflow with this run's own token.

concurrency:
  group: turnout
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Fetch and parse new snapshots
        run: |
          uv run skipjack turnout-fetch
          uv run skipjack turnout-parse

      - name: Fetch and parse the unofficial results
        id: unofficial
        continue-on-error: true
        run: |
          uv run skipjack unofficial-fetch
          uv run skipjack unofficial-parse

      - name: Check for changes
        id: changed
        # git diff --quiet sees only tracked files; a new snapshot day is new files,
        # so the check is on the working tree's status
        run: |
          if [ -z "$(git status --porcelain -- data/turnout data/results_unofficial archives/sbe/campaign_stats archives/sbe/results-unofficial archives/manifest.csv)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the database and test
        if: steps.changed.outputs.skip != 'true'
        run: |
          uv run skipjack build-db
          uv run pytest -q -m "not slow"

      - name: Commit the new snapshots
        if: steps.changed.outputs.skip != 'true'
        run: |
          git config user.name "skipjack bot"
          git config user.email "noreply@github.com"
          git add data/turnout data/results_unofficial archives/sbe/campaign_stats archives/sbe/results-unofficial archives/manifest.csv
          git commit -m "turnout and results snapshot $(date -u +%F)"
          git push

      - name: Publish the site (the bot push alone does not trigger Pages)
        if: steps.changed.outputs.skip != 'true'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Report a failed unofficial results snapshot
        if: steps.unofficial.outcome == 'failure'
        run: |
          echo "::error::The unofficial results step failed; see its log. Turnout was still committed."
          exit 1
